<style>
:root{
  --bege:#E8DCC4; --bege-2:#F2EAD8; --off:#FAF6EE;
  --marrom:#3D2817; --marrom-2:#4A3624;
  --verde:#2D4A3E; --camelo:#B08660; --vermelho:#A0301F;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bege);color:var(--marrom);
  font-family:var(--sans);font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
  padding:40px 18px 56px;display:flex;justify-content:center;
}
.page{width:100%;max-width:440px}

.top{text-align:center;margin-bottom:30px}
.avatar{width:86px;height:86px;border-radius:50%;object-fit:cover;
  border:1px solid var(--camelo);background:var(--bege-2);display:block;margin:0 auto 14px}
.name{font-family:var(--serif);font-weight:600;font-size:1.55rem;letter-spacing:-.01em;margin:0;line-height:1.05}
.stack{display:flex;flex-direction:column;gap:14px}
.banner{
  display:block;border-radius:10px;overflow:hidden;
  border:1px solid rgba(61,40,23,.18);background:var(--off);
  transition:transform .12s ease,border-color .12s ease;
}
.banner:active{transform:scale(.99)}
.banner:hover{border-color:var(--marrom)}
.banner:focus-visible{outline:3px solid var(--verde);outline-offset:3px}
.banner img{display:block;width:100%;height:auto;aspect-ratio:1080/350}

.social{display:flex;justify-content:center;gap:20px;margin-top:28px}
.social a{color:var(--camelo);display:inline-flex;padding:8px}
.social a:hover{color:var(--marrom)}
.social a:focus-visible{outline:3px solid var(--verde);outline-offset:2px;border-radius:6px}

footer{text-align:center;margin-top:22px}
footer a{color:var(--camelo);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;text-decoration:none}
footer a:hover{color:var(--marrom)}

@media(prefers-reduced-motion:reduce){.banner{transition:none}}
</style>
